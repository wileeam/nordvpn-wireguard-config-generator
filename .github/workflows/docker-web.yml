name: Build & Test Web Docker Image

on:
  push:
    branches: ["**"]
    paths:
      - "Web/**"
      - ".github/workflows/docker-web.yml"
  pull_request:
    paths:
      - "Web/**"
      - ".github/workflows/docker-web.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          file: ./Web/Dockerfile
          push: false
          load: true
          tags: nordgen-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name nordgen-web-ci -p 3000:3000 nordgen-web:ci

      - name: Wait for server to respond
        run: |
          echo "Waiting for the server to accept connections..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://localhost:3000/api/servers 2>/dev/null || true)
            if echo "$STATUS" | grep -qE '^[2345][0-9]{2}$'; then
              echo "Server responded with HTTP $STATUS – container is healthy."
              exit 0
            fi
            echo "Attempt $i/30: no response yet (got '$STATUS'), retrying in 2 s..."
            sleep 2
          done
          echo "Server did not respond after 60 s."
          docker logs nordgen-web-ci
          exit 1

      - name: Print container logs
        if: always()
        run: docker logs nordgen-web-ci

      - name: Stop and remove container
        if: always()
        run: docker stop nordgen-web-ci && docker rm nordgen-web-ci
